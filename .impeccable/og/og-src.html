<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;padding:0}
  body{position:relative;background-size:1200px 900px}
  .og-cartaz{position:absolute;left:52px;top:66px;width:610px;padding:44px 48px 36px;--r:-2deg}
  .og-cartaz .letreiro{font-size:6rem;line-height:.86}
  .og-cartaz .pincel{margin-top:22px;font-size:2.05rem;line-height:1.2;color:var(--tinta)}
  .og-cartaz .pincel em{font-style:normal;color:var(--vermelho)}
  .og-foto{position:absolute;right:52px;top:96px;width:470px;--r:4deg}
  .og-foto figcaption{font-size:1.5rem}
  .og-estrela{position:absolute;left:640px;top:34px;width:170px;height:170px;transform:rotate(-12deg);display:grid;place-items:center;color:#fff;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6))}
  .og-estrela svg{position:absolute;inset:0;width:100%;height:100%;fill:var(--vermelho);stroke:var(--papel);stroke-width:5;paint-order:stroke}
  .og-estrela span{position:relative;font-family:var(--f-pincel);font-size:2.1rem;line-height:.95;text-align:center;text-transform:uppercase}
  .og-faixa{position:absolute;left:-40px;right:-40px;bottom:34px;transform:rotate(-1.6deg);background:var(--vermelho);padding:14px 0;text-align:center;box-shadow:0 18px 30px -14px rgba(0,0,0,.8)}
  .og-faixa span{font-family:var(--f-letreiro);text-transform:uppercase;color:var(--papel);font-size:1.75rem;text-shadow:.05em .05em 0 var(--tinta);letter-spacing:.01em}
  .og-premio{margin-top:18px;display:inline-flex;align-items:center;gap:.5rem;padding:8px 14px;background:var(--tinta);color:var(--papel);font-family:var(--f-corpo);font-weight:800;font-stretch:80%;text-transform:uppercase;letter-spacing:.02em;font-size:1.05rem;border-radius:4px;transform:rotate(-1deg)}
  .og-premio b{font-family:var(--f-letreiro);font-weight:400;color:var(--vermelho-vivo);font-size:1.5rem}
  .og-cartaz{top:50px!important}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="burst" viewBox="-4 -4 208 208"><polygon points="100.0,-2.0 113.5,23.2 133.2,8.8 139.0,32.5 165.6,21.9 159.8,49.9 184.0,51.5 173.3,73.3 200.5,82.3 178.0,100.0 195.5,116.8 173.3,126.7 188.3,151.0 159.8,150.1 162.4,174.3 139.0,167.5 134.9,195.8 113.5,176.8 100.0,197.0 86.5,176.8 65.1,195.8 61.0,167.5 37.6,174.3 40.2,150.1 11.7,151.0 26.7,126.7 4.5,116.8 22.0,100.0 -0.5,82.3 26.7,73.3 16.0,51.5 40.2,49.9 34.4,21.9 61.0,32.5 66.8,8.8 86.5,23.2"/></symbol></svg>
<div class="cartaz og-cartaz">
  <span class="fita fita--e"></span><span class="fita fita--d"></span>
  <div class="letreiro"><span class="letreiro__linha">Bacon</span><span class="letreiro__linha">Burguer</span></div>
  <p class="pincel">Pão artesanal, blend de 160g e bacon fritinho. <em>Jardim Vergueiro, SP.</em></p>
  <p class="og-premio"><b>7ª</b> melhor hamburgueria · voto popular 2026</p>
</div>
<figure class="foto-colada og-foto" style="margin:0">
  <span class="fita fita--topo"></span>
  <img src="/assets/img/combo-bacon.webp" width="700" height="467" alt="">
  <figcaption class="pincel">Combo Bacon Burguer</figcaption>
</figure>
<div class="og-estrela"><svg><use href="#burst"/></svg><span>Pede<br>aí!</span></div>
<div class="og-faixa"><span>Terça a domingo · a partir das 16h · Saipos e Keeta</span></div>
</body></html>
