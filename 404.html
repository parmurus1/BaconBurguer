  <style>
    .perdido {
      display: grid;
      place-items: center;
      min-height: calc(100svh - 140px);
      padding: 3rem var(--gutter) 4rem;
    }
    .perdido__cartaz {
      --r: -1.6deg;
      position: relative;
      width: min(100%, 640px);
      padding: clamp(2.25rem, 7vw, 3.5rem) clamp(1.25rem, 6vw, 3.25rem) clamp(1.75rem, 5vw, 2.5rem);
    }
    .perdido__titulo {
      font-family: var(--f-letreiro);
      font-weight: 400;
      text-transform: uppercase;
      font-size: clamp(2.3rem, 9vw, 4.2rem);
      line-height: .9;
      color: var(--vermelho);
      text-shadow: .055em .055em 0 var(--tinta);
      text-wrap: balance;
      max-width: calc(100% - 4.5rem);
    }
    .perdido__ainda { margin-top: .6rem; font-size: clamp(1.6rem, 6vw, 2.3rem); color: var(--tinta); transform: rotate(-3deg); transform-origin: left; }
    .perdido__texto { margin-top: 1.25rem; max-width: 40ch; font-size: 1.05rem; line-height: 1.5; color: var(--tinta-2); }
    .perdido__acoes { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 1.75rem; }
    .perdido__estrela {
      position: absolute;
      z-index: 4;
      top: -2.8rem;
      right: -.9rem;
      display: grid;
      place-items: center;
      width: clamp(96px, 26vw, 128px);
      aspect-ratio: 1;
      color: #fff;
      transform: rotate(12deg);
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .55));
    }
    .perdido__estrela svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: var(--vermelho); stroke: var(--papel); stroke-width: 5; paint-order: stroke; }
    .perdido__estrela span { position: relative; font-family: var(--f-pincel); font-size: clamp(1.5rem, 5vw, 2rem); }
    /* o porco de pernas pro ar */
    .perdido__porco {
      display: block;
      width: clamp(120px, 30vw, 170px);
      aspect-ratio: 210 / 120;
      margin: 2rem 0 0 auto;
      --pig-fill: var(--papel);
      --pig-ink: var(--tinta);
      transform: rotate(180deg);
    }
    body { padding-bottom: 0; }
  </style>
</head>
